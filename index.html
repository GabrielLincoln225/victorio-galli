<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta name="theme-color" content="%THEME%" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Victório Galli, Deputado Federal 1123" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%TITLE%" />
    <meta name="twitter:description" content="%DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link
      rel="preload"
      as="image"
      href="/hero/hero-poster-960.webp"
      type="image/webp"
      media="(max-width: 767px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/hero/hero-poster.webp"
      type="image/webp"
      media="(min-width: 768px)"
      fetchpriority="high"
    />

    <script>
      /* Decide o modo de animação antes da primeira pintura: sem JS ou com
         prefers-reduced-motion, a hero mostra o bloco final completo. */
      (function () {
        var d = document.documentElement;
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.add("motion");
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
